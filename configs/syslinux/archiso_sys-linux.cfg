LABEL arch64
MENU LABEL Install Omarchy
# Boots from omarchy-logo.cfg, which puts the boot logo up first.
CONFIG /boot/syslinux/omarchy-logo.cfg /boot/syslinux/

# Try Omarchy: the root image, read from the medium as it is used, with the
# Try layer over it (hooks/omarchy_try).
LABEL arch64try
MENU LABEL ^Try Omarchy
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% omarchy.try=1 systemd.gpt_auto=0 quiet xe.enable_panel_replay=0 initramfs_async=0 usb-storage.delay_use=0 loglevel=3 systemd.show_status=false
