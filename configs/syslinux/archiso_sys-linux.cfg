# The logo's rows and the menu's layout around them (bin/omarchy-isolinux-menu).
INCLUDE omarchy-logo-menu.cfg

# Both entries boot through a config that puts the logo up again in the same
# cells, without the entries, and loads the kernel under it. MENU INDENT
# centres an entry under the logo's 41 columns.
LABEL arch64
MENU LABEL Install Omarchy
MENU INDENT 13
CONFIG /boot/syslinux/omarchy-logo.cfg /boot/syslinux/

# Try Omarchy: the root image, read from the medium as it is used, with the
# Try layer over it (hooks/omarchy_try).
LABEL arch64try
MENU LABEL ^Try Omarchy
MENU INDENT 15
CONFIG /boot/syslinux/omarchy-logo-try.cfg /boot/syslinux/
