SERIAL 0 115200
UI menu.c32
FONT omarchy-logo.psf

# The BIOS menu stays on the VGA text console, the mode ISOLINUX loads the
# kernel in and the kernel's console starts in: no mode switch after a pick,
# which on some panels and monitors is two seconds of black while they sync
# to the new mode. In the logo's font, the install medium's menu shows the
# logo where ISOLINUX's loading screen and the initramfs draw it
# (omarchy-logo-menu.cfg, included by archiso_sys-linux.cfg, which also sets
# its rows), so a pick takes only the entries away. The PXE menu has no logo:
# its entries sit where the install medium's do.
# An entry gets WIDTH - 2 * MARGIN - 4 columns: 22, room for the PXE menu's
# "Install Omarchy (NBD)". menu.c32 draws the box's top border, title and
# separator on rows VSHIFT + 1 to 3, black on black here, and the entries
# from VSHIFT + 4; TABMSGROW, CMDLINEROW, TIMEOUTROW and HELPMSGROW count from
# VSHIFT, HELPMSGENDROW is absolute.
MENU WIDTH 80
MENU MARGIN 27
MENU ROWS 2
MENU VSHIFT 12
MENU TABMSGROW 7
MENU CMDLINEROW 7
MENU TIMEOUTROW 8
MENU HELPMSGROW 9
MENU HELPMSGENDROW 21

# Refer to https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32
# On the text console only the ANSI attributes count: the logo bright green
# (the DISPLAY file's 0A), the selected entry bright white, the other grey,
# and the box, title and messages black on black.

MENU COLOR screen       37;40
MENU COLOR border       30;40
MENU COLOR title        30;40
MENU COLOR disabled     1;32;40
MENU COLOR sel          1;37;40
MENU COLOR hotsel       1;37;40
MENU COLOR unsel        37;40
MENU COLOR hotkey       37;40
MENU COLOR help         30;40
MENU COLOR timeout_msg  30;40
MENU COLOR timeout      30;40
MENU COLOR msg07        37;40
MENU COLOR tabmsg       30;40
MENU COLOR cmdline      37;40

MENU IMMEDIATE
