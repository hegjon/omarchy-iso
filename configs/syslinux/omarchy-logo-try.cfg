# Try Omarchy's BIOS boot: omarchy-logo.cfg's for Install Omarchy, with Try's
# own kernel options (omarchy.try=1, systemd.gpt_auto=0). Its menu entry
# (archiso_sys-linux.cfg) comes here; without vga=0x0f04 the kernel's setup
# code would set the 80x25 mode again, and the menu's logo, still on the
# screen, would show in the ROM's font, as box drawing.
FONT omarchy-logo.psf
DISPLAY omarchy-logo.txt
PROMPT 0
TIMEOUT 0
DEFAULT arch64

LABEL arch64
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND vga=0x0f04 vt.global_cursor_default=0 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% omarchy.try=1 systemd.gpt_auto=0 quiet xe.enable_panel_replay=0 initramfs_async=0 usb-storage.delay_use=0 loglevel=3 systemd.show_status=false
