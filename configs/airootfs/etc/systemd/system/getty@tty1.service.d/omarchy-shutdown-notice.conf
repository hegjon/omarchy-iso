# "Rebooting..." or "Powering off..." under the logo once the greeter's
# session is gone in a shutdown (omarchy-shutdown-notice). A unit wanted by
# reboot.target never started on Ctrl+Alt+Delete in QEMU; this runs at the
# moment tty1 is free, whatever starts the shutdown.
[Service]
ExecStopPost=-/usr/local/bin/omarchy-shutdown-notice
